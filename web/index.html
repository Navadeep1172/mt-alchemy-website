<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MT Alchemy - people development consultancy. Emotional intelligence, leadership development, team engagement and workplace well-being.">
  <meta name="theme-color" content="#0E4C5C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MT Alchemy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MT Alchemy | People Development Consultancy</title>
  <link rel="manifest" href="manifest.json">

  <!-- Brand splash shown while the Flutter engine loads and boots. -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #062A33;
      font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.45s ease;
    }
    #splash.fade { opacity: 0; }
    #splash .mark {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: linear-gradient(135deg, #E8A33D, #C4841D);
      color: #062A33;
      font-weight: 800;
      font-size: 21px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, 'Times New Roman', serif;
    }
    #splash .name {
      font-size: 17px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #E8A33D;
    }
    #splash .tag {
      font-size: 12.5px;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.62);
    }
    #splash .bar {
      width: 180px;
      height: 3px;
      margin-top: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }
    #splash .bar i {
      display: block;
      width: 40%;
      height: 100%;
      background: #E8A33D;
      animation: splash-slide 1.1s ease-in-out infinite;
    }
    @keyframes splash-slide {
      0% { margin-left: -40%; }
      100% { margin-left: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="mark">MT</div>
    <div class="name">MT Alchemy</div>
    <div class="tag">People development consultancy</div>
    <div class="bar"><i></i></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Fade the splash out as soon as Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('fade');
      setTimeout(function () { splash.remove(); }, 500);
    });
  </script>
</body>
</html>
